name: Deploy GAR Archives

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  checks: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_STORAGE_BUCKET: ${{ secrets.VITE_SUPABASE_STORAGE_BUCKET }}

      # GitHub Pages не умеет SPA-fallback для чистых URL, поэтому
      # 404.html = index.html: BrowserRouter сам разберёт /character, /history…
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      # Защита от «белой страницы»: пути ассетов в собранном index.html
      # обязаны совпадать с путём, по которому Pages отдаёт этот репозиторий.
      - name: Check asset base against Pages URL
        run: |
          base="/${GITHUB_REPOSITORY#*/}/"
          echo "Pages отдаёт сайт из: $base"
          if ! grep -q "src=\"$base" dist/index.html; then
            echo "::error::В dist/index.html ассеты подключены не из \"$base\" — на GitHub Pages это даст 404 и пустую страницу."
            echo "Проверьте base в vite.config.js (он берётся из GITHUB_REPOSITORY) и settings → Pages."
            grep -o 'src="[^"]*"' dist/index.html
            exit 1
          fi
          echo "OK: ассеты лежат по адресу $base"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
